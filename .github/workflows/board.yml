name: Departures board

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/board.mjs, .github/workflows/board.yml]

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render assets/board.svg from live GitHub data
        run: node scripts/board.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when the board changed
        run: |
          git diff --quiet assets/board.svg && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/board.svg
          git commit -m 'chore: refresh departures board'
          git push
