<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Souza systems profile banner</title>
  <desc id="desc">Dark systems banner with boot terminal, architecture graph, project portals, and blue oscilloscope signal trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02030A"/>
      <stop offset="0.46" stop-color="#081125"/>
      <stop offset="1" stop-color="#02030A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="132" y1="104" x2="1104" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45FF9B"/>
      <stop offset="0.42" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <linearGradient id="portal" x1="760" y1="120" x2="1100" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#006DFF"/>
      <stop offset="1" stop-color="#45FF9B"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.00 0 0 0 0 0.78 0 0 0 0 1.00 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#12385D" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)" opacity="0.55"/>
  <path d="M70 328 C178 260 244 367 344 288 C454 201 520 270 615 180 C722 79 840 168 916 110 C1012 37 1082 91 1134 58" stroke="url(#cyan)" stroke-width="2" opacity="0.68"/>
  <path d="M70 342 H1134" stroke="#12385D" stroke-width="1"/>
  <path d="M70 72 H1134" stroke="#12385D" stroke-width="1"/>

  <g filter="url(#glow)">
    <rect x="78" y="96" width="7" height="236" rx="3.5" fill="url(#cyan)"/>
  </g>

  <text x="118" y="134" fill="#EAF8FF" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">
    Lucas Souza
  </text>
  <text x="120" y="176" fill="#BED6EE" font-family="Bahnschrift, Aptos, Segoe UI, sans-serif" font-size="22" font-weight="600">
    systems engineer · AI products · production discipline
  </text>
  <text x="120" y="220" fill="#EAF8FF" font-family="Bahnschrift, Aptos, Segoe UI, sans-serif" font-size="25" font-weight="700">
    Boot specs. Wire contracts. Prove deploys. Open portals.
  </text>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">
    <rect x="120" y="262" width="458" height="74" rx="8" fill="#030A18" stroke="#1B68B6"/>
    <text x="144" y="288" fill="#45FF9B">$ mount /spec --strict</text>
    <text x="144" y="313" fill="#00C8FF">$ deploy scene --smoke-check</text>
  </g>

  <g stroke-width="2" stroke-linecap="round" opacity="0.9">
    <circle cx="682" cy="252" r="16" fill="#031027" stroke="#45FF9B"/>
    <circle cx="752" cy="192" r="20" fill="#031027" stroke="#00C8FF"/>
    <circle cx="826" cy="252" r="15" fill="#031027" stroke="#EAF8FF"/>
    <circle cx="748" cy="310" r="13" fill="#031027" stroke="#FFC857"/>
    <path d="M697 243 L735 205 M770 205 L812 242 M752 212 L748 297 M696 258 L735 302 M763 302 L813 260" stroke="#5EC8FF" opacity="0.58"/>
    <text x="646" y="164" fill="#BED6EE" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">DentAI · UNIVALI · AI stack</text>
  </g>

  <g filter="url(#glow)">
    <ellipse cx="984" cy="204" rx="72" ry="24" transform="rotate(-22 984 204)" stroke="url(#portal)" stroke-width="4"/>
    <ellipse cx="1057" cy="258" rx="64" ry="22" transform="rotate(22 1057 258)" stroke="url(#portal)" stroke-width="4"/>
  </g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700">
    <text x="920" y="156" fill="#00C8FF">Genexus18MCP</text>
    <text x="1010" y="326" fill="#45FF9B">locoChat</text>
  </g>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" fill="#8CA6C4">
    <text x="118" y="366">github.com/lennix1337</text>
    <text x="760" y="366">Three.js · TypeScript · C# · Gemini · Claude · Codex</text>
  </g>
</svg>
